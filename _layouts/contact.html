<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #10110f !important;
      color: #e6e8e2;
    }

    body {
      font-family: monospace;
    }

    .contact-page {
      min-height: 100vh;
      padding: 30px 25px;
      box-sizing: border-box;
    }

    .contact-page-inner {
      max-width: 850px;
      margin: 0 auto;
    }

    .contact-page-nav {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(181,232,83,.2);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .contact-page-nav a {
      color: #b5e853;
      text-decoration: none;
    }

    .contact-page-nav a:hover {
      color: #fff;
    }

    .contact-page-content {
      color: #e6e8e2;
    }

    @media (max-width: 600px) {
      .contact-page {
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="contact-page">
    <div class="contact-page-inner">

      <nav class="contact-page-nav">
        <span>OTHMANE01 // SECURITY LAB</span>
        <a href="{{ '/' | relative_url }}">← BACK TO HOME</a>
      </nav>

      <main class="contact-page-content">
        {{ content }}
      </main>

    </div>
  </div>

</body>
</html>
