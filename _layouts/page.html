<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ page.title }} | {{ site.title }}
  </title>

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    body {
      background: #10110f;
      color: #e6e8e2;
      font-family: monospace;
      margin: 0;
      padding: 30px 20px;
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #344b36;
      margin-bottom: 35px;
    }

    .page-header a {
      color: #b5e853;
      text-decoration: none;
    }

    .page-header a:hover {
      color: #fff;
    }

    .page-title {
      color: #b5e853;
      font-size: 1.8em;
      margin-bottom: 25px;
    }

    .page-content {
      line-height: 1.7;
    }

    .page-footer {
      margin-top: 60px;
      padding-top: 15px;
      border-top: 1px solid #344b36;
      color: #788578;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="page-container">

    <header class="page-header">
      <a href="{{ '/' | relative_url }}">
        OTHMANE01 // SECURITY LAB
      </a>

      <a href="{{ '/' | relative_url }}">
        &larr; BACK TO HOME
      </a>
    </header>

    <main class="page-content">

      {% unless page.hide_title %}
        <h1 class="page-title">{{ page.title }}</h1>
      {% endunless %}

      {{ content }}

    </main>

    <footer class="page-footer">
      OTHMANE01 // SECURITY RESEARCH // PUBLIC RELEASE
    </footer>

  </div>

</body>
</html>
