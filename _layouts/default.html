
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

  {% include head-custom.html %}
  {% seo %}
</head>

<body>

  <header>
    <div class="container">

      <a id="a-title" href="{{ '/' | relative_url }}">
        <h1>{{ site.title | default: site.github.repository_name }}</h1>
      </a>

      <h2>{{ site.description | default: site.github.project_tagline }}</h2>

      <nav class="nav-menu">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/thm/' | relative_url }}">THM</a>
        <a href="{{ '/htb/' | relative_url }}">HTB</a>
        <a href="{{ '/notes/' | relative_url }}">Notes</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/about/contact' | relative_url }}">Contact</a>
      </nav>

    </div>
  </header>

  <div class="container">
    <section id="main_content">
      {{ content }}
    </section>
  </div>

  <style>
    /* Navigation menu */
    .nav-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .nav-menu a {
      display: inline-block;
      padding: 8px 14px;
      color: #b5e853;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 5px;
      text-decoration: none;
      font-family: monospace;
      transition: all 0.2s ease;
    }

    .nav-menu a:hover {
      color: #151515;
      background: #b5e853;
      border-color: #b5e853;
    }

    /* Center images in writeups and other content */
    #main_content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 25px auto;
    }
  </style>

</body>
</html>
